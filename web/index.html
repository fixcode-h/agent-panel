<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent 面板</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d97757'/><path d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <script>
      // 选过主题就用选过的，否则跟随系统
      try {
        var t = localStorage.getItem('theme')
        var light = t ? t === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches
        if (light) document.documentElement.classList.remove('dark')
        // 字体设置：先用上次记下的，设置取回来后再按设置更新
        var a = JSON.parse(localStorage.getItem('appearance') || '{}')
        for (var k in a) document.documentElement.style.setProperty(k, a[k])
        // 配色：同样先用上次记下的（web/src/lib/appearance.ts 的 applyPalette）
        // 没记过就是默认的「Claude Code」；「Claude」配色是 index.css 里的基础值，不挂属性
        var p = localStorage.getItem('appearance-palette') || 'code'
        if (p !== 'claude') document.documentElement.dataset.palette = p
        // Markdown 样式里改过的项（web/src/lib/markdown-style.ts 的 applyMarkdownStyle）
        var m = localStorage.getItem('appearance-md')
        if (m) {
          var st = document.createElement('style')
          st.id = 'md-style'
          st.textContent = m
          document.head.appendChild(st)
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
