# 出包：只在推送到 main（用户明确要求合并到主干时才会发生）时运行，dev 分支不会触发。
# 先跑和 dev 一样的检查（ci.yml），通过后出包并发布正式版（Latest），标签 v<主>.<次>.<提交数>。
# 包里是正式版前端 + 打成单文件的服务端，不含在线演示的模拟后端。
name: 出包

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    # 出包本身几分钟；卡住时按上限失败，不要把整个 job 占到 6 小时
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 计算版本号
        id: ver
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tray
          path: build/tray
      - name: 出包
        run: node scripts/package.mjs ${{ steps.ver.outputs.version }} --require-tray
      - name: 生成更新说明
        run: node scripts/release-notes.mjs ${{ steps.ver.outputs.version }} main > release/notes.md
      - name: 发布到 Releases
        # 发布逻辑在 scripts/release-publish.mjs：对瞬时失败（HTTP 5xx / 超时 / 网络）重试，4xx 直接失败。
        # 起因：出包 run 40292001333 在 gh release create 上撞到 GitHub API 504，一次瞬时故障就让整个出包失败。
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/release-publish.mjs "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file release/notes.md \
            --asset "release/agent-panel-${VERSION}.zip" \
            --asset "release/agent-panel-${VERSION}-mac.tar.gz" \
            --asset "release/agent-panel-${VERSION}-mac.zip" \
            --asset "release/agent-panel-${VERSION}-linux.tar.gz" \
            --asset "release/SHA256SUMS"
