# 出包：只在推送到 main（收尾合并主干时）时运行，dev 分支不会触发。
# 先跑和 dev 一样的检查（ci.yml），通过后出包并发布正式版（Latest），标签 v<主>.<次>.<提交数>。
# 包里是正式版前端 + 打成单文件的服务端，不含在线演示的模拟后端。
name: 出包

on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认只读；只有发布那一步的 job 单独拿 contents: write
permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    # 出包本身几分钟；卡住时按上限失败，不要把整个 job 占到 6 小时
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 发布只用下面 gh 的 GH_TOKEN；不把令牌留在 .git/config 里给 npm ci 的安装脚本
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 用例数不设上限（ADR 0031）：出包时和上一个正式版对比，涨了多少写进这次运行的摘要
      - name: 用例数对比
        run: node scripts/test-budget.mjs --report --since auto | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 计算版本号
        id: ver
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tray
          path: build/tray
      - name: 出包
        run: node scripts/package.mjs ${{ steps.ver.outputs.version }} --require-tray
      - name: 生成更新说明
        run: node scripts/release-notes.mjs ${{ steps.ver.outputs.version }} main > release/notes.md
      - name: 发布到 Releases
        # 发布逻辑在 scripts/release-publish.mjs：对瞬时失败（HTTP 5xx / 超时 / 网络）重试，4xx 直接失败。
        # 起因：出包 run 40292001333 在 gh release create 上撞到 GitHub API 504，一次瞬时故障就让整个出包失败。
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node scripts/release-publish.mjs "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file release/notes.md \
            --asset "release/agent-panel-${VERSION}.zip" \
            --asset "release/agent-panel-${VERSION}-mac.tar.gz" \
            --asset "release/agent-panel-${VERSION}-mac.zip" \
            --asset "release/agent-panel-${VERSION}-linux.tar.gz" \
            --asset "release/SHA256SUMS"
