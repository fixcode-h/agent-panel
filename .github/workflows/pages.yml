# 在线演示：dev 分支每次「检查」通过后，构建演示版（浏览器内模拟后端）并发布到 GitHub Pages。
# 用 workflow_run 触发，部署时的分支是默认分支，满足 github-pages 环境只允许默认分支部署的限制；
# 构建的内容取自 dev 分支触发那次检查的提交。
name: 在线预览

on:
  workflow_run:
    workflows: [检查]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# 构建只需要读代码；发布权限只给 deploy，npm ci 和构建（会跑依赖的安装脚本）拿不到 pages / OIDC 令牌
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # branches: [dev] 看的是触发那次检查的分支名，fork 把分支也叫 dev 提 PR 就能混进来：
    # 只认本仓库自己 push 到 dev 的那次检查
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'dev' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --mode demo --base ./
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
