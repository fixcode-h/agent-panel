# 在线演示：dev 分支每次「检查与出包」通过后，构建演示版（浏览器内模拟后端）并发布到 GitHub Pages。
# 用 workflow_run 触发，部署时的分支是默认分支，满足 github-pages 环境只允许默认分支部署的限制；
# 构建的内容取自 dev 分支触发那次检查的提交。
name: 在线预览

on:
  workflow_run:
    workflows: [检查与出包]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'dev' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --mode demo --base ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
