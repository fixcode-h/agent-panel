# 检查：类型、代码检查和格式、CLI 输出解析、端到端测试、构建、界面截图，以及在 Windows 上编译并试运行托盘程序。
# 推送到 dev 和 PR 时运行，只检查不出包；主干的出包流程（release.yml）也调用它，检查通过后再出包。
name: 检查

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # 卡住时快速失败：正常一轮十几分钟，超过上限就当失败，不要占着 job 到 6 小时
    timeout-minutes: 30
    steps:
      # 预算检查要读合并提交的父提交（子提交里的「测试预算:」段）：浅克隆看不到父提交，
      # 合并提交会被当成普通提交、说明只剩标题。这个 job 必须拉全历史。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # lint 里已经跑过静态的预算检查（不执行测试）；这里只跑单测本身
      - run: npm run lint
      # 单测各批已经把 tap 写进 logs/tests/，合并起来用真实用例数复核一次分层预算（同一次全量只统计一次，不重复跑测试）。
      # 不能再传 --test-reporter=tap：单测入口自己就有 reporter，叠加会报「reporter 和 destination 数量对不上」。
      - run: npm run test:unit
      - run: cat logs/tests/unit-timing.tap logs/tests/unit-rest.tap > "$RUNNER_TEMP/unit-tap.txt" && node scripts/test-budget.mjs --tap "$RUNNER_TEMP/unit-tap.txt"
      - run: npm run build

  # 端到端单独一个 job：scripts/e2e.mjs 内部并行跑各个分片（各自临时目录、端口和服务），
  # 和上面的类型检查 / 单测 / 构建同时进行，总时长取两者里最慢的那个。
  # 单 job 内的并发默认最多 4 个分片（AGENT_PANEL_E2E_CONCURRENCY 可覆盖）：12 个分片全开会把
  # 这台 runner 的 CPU、内存和端口抢满，时序敏感的用例偶发失败。
  # 和界面检查（ui）保留并行、不加 needs：GitHub 托管的每个 job 各是一台独立 VM，两者不共享
  # CPU / 内存；串行反而会让总时长多出约 3 分钟。
  # 每个分片自己的看门狗和收尾在 scripts/e2e/harness.mjs 里：卡住时按分片失败退出，不会拖到 workflow 超时。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # 各分片耗时写进 e2e-timings.json，改了测试可以下载对比
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timings
          path: e2e-timings.json
          retention-days: 7

  # 界面检查：打开在线演示版走一遍常用页面，没有报错、没有横向滚动；截图作为附件上传，改界面时可以下载对比。
  # scripts/ui-check.mjs 内部并行跑 scripts/ui/ 下的各个分片（各自的服务、浏览器和演示数据）
  ui:
    runs-on: ubuntu-latest
    # 正常一分钟左右；卡住时快速失败
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 浏览器按 Playwright 的版本缓存：命中时不用再下载。
      # 不加 --with-deps：系统依赖 ubuntu-latest 自带的 Chrome 已经装齐，而 apt 有时一卡十几分钟
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx vite build --mode demo
      - run: node scripts/ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui-shots/
          retention-days: 7
      # 各分片每一步的耗时写进 ui-timings.json，改了检查可以下载对比
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-timings
          path: ui-timings.json
          retention-days: 7

  # 推送到 dev 时看这次改了哪些文件：Windows 托盘那一步最慢，只在托盘程序、服务端或出包相关的文件变了时才跑。
  # 主干出包（release.yml 调用本文件）、PR、手动运行时总是跑
  changes:
    runs-on: ubuntu-latest
    outputs:
      tray: ${{ steps.diff.outputs.tray }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/dev" ] \
            || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "tray=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(scripts/tray/|scripts/package\.mjs|server/|shared/|package(-lock)?\.json|\.github/workflows/)'; then
            echo "tray=true" >> "$GITHUB_OUTPUT"
          else
            echo "tray=false" >> "$GITHUB_OUTPUT"
          fi

  # Windows 托盘启动程序：用系统自带的 .NET Framework 编译器编译，不需要装别的
  tray:
    needs: changes
    if: needs.changes.outputs.tray == 'true'
    runs-on: windows-latest
    # 编译 + 出包 + 试运行正常几分钟；卡住时快速失败
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 编译 AgentPanel.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          # UI 自动化（在浏览器标签栏里找面板）的程序集在 WPF 子目录里
          $wpf = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\WPF'
          New-Item -ItemType Directory -Force build/tray | Out-Null
          $out = & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 `
            /win32icon:scripts\tray\app.ico /out:build\tray\AgentPanel.exe `
            /lib:"$wpf" /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:UIAutomationClient.dll /r:UIAutomationTypes.dll /r:WindowsBase.dll scripts\tray\AgentPanel.cs 2>&1
          $code = $LASTEXITCODE
          # 编译信息写成注解，在检查结果页面直接能看到
          foreach ($l in $out) { if ("$l" -match 'error') { Write-Output "::error::$l" } else { Write-Output "$l" } }
          if ($code -ne 0) { exit $code }
          Get-Item build/tray/AgentPanel.exe | Format-List Name, Length
      # 在 Windows 上真的跑一遍：托盘程序启动服务、第二次双击直接退出、托盘程序结束后服务跟着结束
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/package.mjs 0.0.0 --require-tray --no-archive
      - name: 试运行托盘程序
        shell: pwsh
        run: |
          $dir = Resolve-Path release/agent-panel-0.0.0
          $exe = Join-Path $dir AgentPanel.exe
          $log = Join-Path $dir agent-panel.log
          $server = { Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -like '*server.mjs*' } }
          $p = Start-Process -FilePath $exe -WorkingDirectory $env:TEMP -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:8787/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200 } catch {}
          }
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { Write-Output '::error::托盘程序没有启动服务'; exit 1 }
          if (-not (& $server)) { Write-Output '::error::没有找到服务进程'; exit 1 }
          $p2 = Start-Process -FilePath $exe -PassThru
          if (-not $p2.WaitForExit(15000)) { Write-Output '::error::再次启动时没有直接退出'; exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          if (& $server) { Write-Output '::error::托盘程序结束后服务还在运行'; exit 1 }
          Write-Output '托盘程序试运行通过'
      - uses: actions/upload-artifact@v4
        with:
          name: tray
          path: build/tray/AgentPanel.exe
          retention-days: 7
