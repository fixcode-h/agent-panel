# 每次推送都检查（类型、端到端测试、构建）。
# 只有推送到 main（用户明确要求合并到主干时才会发生）才出包并发布正式版（Latest），标签 v<主>.<次>.<提交数>；
# 推送到 dev 只检查，不出包。
# 包里是正式版前端 + 打成单文件的服务端，不含在线演示的模拟后端。
name: 检查与出包

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:e2e
      - run: npm run build

  # Windows 托盘启动程序：用系统自带的 .NET Framework 编译器编译，不需要装别的
  tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 AgentPanel.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          New-Item -ItemType Directory -Force build/tray | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 `
            /win32icon:scripts/tray/app.ico /out:build/tray/AgentPanel.exe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll scripts/tray/AgentPanel.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item build/tray/AgentPanel.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: tray
          path: build/tray/AgentPanel.exe
          retention-days: 7

  release:
    needs: [test, tray]
    # dev 分支不出包，只有主干发布
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 计算版本号
        id: ver
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tray
          path: build/tray
      - name: 出包
        run: node scripts/package.mjs ${{ steps.ver.outputs.version }} --require-tray
      - name: 生成更新说明
        run: node scripts/release-notes.mjs ${{ steps.ver.outputs.version }} main > release/notes.md
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "版本 $tag 已经发布过，跳过"
            exit 0
          fi
          gh release create "$tag" \
            "release/agent-panel-${VERSION}.zip" \
            "release/agent-panel-${VERSION}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release/notes.md \
            --latest
